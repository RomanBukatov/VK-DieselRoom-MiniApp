# Ограничение частоты запросов к API по IP клиента (реальный IP восстанавливает realip ниже).
# Лимиты щедрые: в баре десятки гостей сидят на одном Wi-Fi (один IP), а мобильные операторы держат многих
# абонентов за общим адресом. Цель — не дать одному скрипту или зажатой кнопке занять единственное ядро сервера.
#   api_read  — все запросы к /api/: 30 в секунду, всплеск до 120;
#   api_write — изменения (POST/PUT/DELETE): 6 в секунду, всплеск до 30; для GET ключ пустой — лимит не применяется.
map $request_method $api_write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_read:10m rate=30r/s;
limit_req_zone $api_write_key zone=api_write:10m rate=6r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Настоящий IP клиента: перед контейнером стоит nginx хоста (TLS), он передаёт адрес в X-Forwarded-For.
    # Без этого $remote_addr у всех запросов — адрес шлюза Docker, и лимиты limit_req
    # срабатывали бы сразу на всех гостей.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Раздача SPA
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://m.vk.com https://vk.ru https://*.vk.ru https://m.vk.ru https://web.telegram.org;" always;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API запросов к бэкенду
    location /api/ {
        limit_req zone=api_read burst=120 nodelay;
        limit_req zone=api_write burst=30 nodelay;
        # Загрузка фото подарка из админки: клиент сжимает его до нескольких сотен КБ
        client_max_body_size 4m;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_pass http://diesel-api:5062/api/;
        proxy_http_version 1.1;
        # WebSocket не используется: пустой Connection позволяет держать keep-alive соединение с бэкендом
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Фото подарков: адрес не меняется, поэтому кэшируем надолго (заголовки ставит API)
    location /api/media/ {
        limit_req zone=api_read burst=120 nodelay;
        proxy_pass http://diesel-api:5062/api/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование интерактивной документации Scalar
    location /scalar/ {
        proxy_pass http://diesel-api:5062/scalar/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Проксирование спецификации OpenAPI (нужно для работы Scalar UI)
    location /openapi/ {
        proxy_pass http://diesel-api:5062/openapi/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Экстремальное кэширование статических ассетов фронтенда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://m.vk.com https://vk.ru https://*.vk.ru https://m.vk.ru https://web.telegram.org;" always;
    }

    # Кеширование остальных статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
