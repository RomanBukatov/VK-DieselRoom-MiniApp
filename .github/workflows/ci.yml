name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · .NET 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DieselRoomApp.slnx
      - name: Build
        run: dotnet build DieselRoomApp.slnx --no-restore -c Release
      - name: Test
        run: dotnet test DieselRoomApp.slnx --no-build -c Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend · React 19 + Bun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diesel-client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Monolithic bundle (один JS для iOS WebKit)
        run: test "$(ls dist/assets/*.js | wc -l)" -eq 1

  secrets:
    name: Secret scan · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f DieselRoom.Api/Dockerfile -t diesel-api .
      - name: Build client image
        run: docker build -t diesel-client ./diesel-client
